<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Focus Tracker · Pomodoro & Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b1220;
    --card: #141d31;
    --card-2: #0f1729;
    --line: #263349;
    --text: #e9edf5;
    --text-dim: #8996ad;
    --focus: #5eead4;
    --focus-glow: rgba(94, 234, 212, .35);
    --rest: #f9a35a;
    --rest-glow: rgba(249, 163, 90, .35);
    --danger: #f87171;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --ring-track: #1e293f;
    --shadow: 0 20px 45px rgba(0,0,0,.45);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(94,234,212,.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(249,163,90,.06), transparent 45%),
      var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }

  .app{
    width: 100%;
    max-width: 420px;
  }

  .eyebrow{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    padding: 0 4px 14px;
  }
  .eyebrow h2{
    font-family:'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .eyebrow span{
    font-family:'IBM Plex Mono', monospace;
    font-size: .78rem;
    color: var(--text-dim);
  }

  .card{
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 30px 24px 26px;
    display:flex;
    flex-direction:column;
    gap: 26px;
  }

  /* ---------- Pomodoro ---------- */
  .pomodoro{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
  }

  .ring-wrap{
    position: relative;
    width: 240px;
    height: 240px;
    max-width: 68vw;
    max-height: 68vw;
  }

  .ring-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); display:block; }

  .ring-track{ fill:none; stroke: var(--ring-track); stroke-width: 8; }

  .ring-progress{
    fill:none;
    stroke: var(--focus);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear, stroke .4s ease;
    filter: drop-shadow(0 0 8px var(--focus-glow));
  }
  .ring-progress.rest{ stroke: var(--rest); filter: drop-shadow(0 0 8px var(--rest-glow)); }

  .ring-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 8px;
    text-align:center;
  }

  .status-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size: .72rem;
    letter-spacing: .5px;
    color: var(--focus);
    background: rgba(94,234,212,.1);
    border: 1px solid rgba(94,234,212,.3);
    padding: 5px 12px;
    border-radius: 30px;
    transition: all .3s ease;
  }
  .status-badge.rest{
    color: var(--rest);
    background: rgba(249,163,90,.1);
    border-color: rgba(249,163,90,.3);
  }

  .time{
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(2.4rem, 11vw, 3.1rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }

  .cycle-dots{
    display:flex; gap:6px;
  }
  .cycle-dots span{
    width:6px; height:6px; border-radius:50%;
    background: var(--line);
    transition: background .3s ease, transform .3s ease;
  }
  .cycle-dots span.done{ background: var(--focus); transform: scale(1.15); }

  .controls{ display:flex; gap:10px; width:100%; }

  button{
    font-family:'Inter', sans-serif;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: .95rem;
    border-radius: var(--radius-sm);
    transition: transform .15s ease, opacity .15s ease, background .2s ease;
    touch-action: manipulation;
  }
  button:active{ transform: scale(.96); }

  .btn-primary{
    flex: 1.4;
    background: var(--focus);
    color: #08211c;
    padding: 13px 10px;
  }
  .btn-primary.rest{ background: var(--rest); color: #2b1706; }

  .btn-ghost{
    flex: 1;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 13px 10px;
  }
  .btn-ghost:hover{ border-color: var(--text-dim); color: var(--text); }

  .duration-row{
    display:flex;
    gap: 10px;
    width:100%;
    justify-content:center;
  }
  .stepper{
    display:flex; align-items:center;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow:hidden;
  }
  .stepper button{
    background: transparent; color: var(--text-dim);
    width: 32px; height: 32px; font-size: 1rem;
    border-radius: 0;
  }
  .stepper button:hover{ color: var(--focus); }
  .stepper .val{
    font-family:'IBM Plex Mono', monospace;
    font-size: .78rem;
    color: var(--text-dim);
    padding: 0 8px;
    min-width: 58px;
    text-align:center;
  }

  hr{ border:none; border-top: 1px solid var(--line); }

  /* ---------- Agenda ---------- */
  .agenda{ display:flex; flex-direction:column; gap: 14px; }

  .agenda-head{
    display:flex; justify-content:space-between; align-items:center;
  }
  .agenda-head h3{
    font-family:'Space Grotesk', sans-serif;
    font-size: 1rem;
    font-weight: 700;
  }
  .agenda-head .count{
    font-family:'IBM Plex Mono', monospace;
    font-size: .78rem;
    color: var(--text-dim);
  }

  .input-group{ display:flex; gap:10px; }

  input[type="text"]{
    flex:1;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--text);
    font-size: .95rem;
    font-family: 'Inter', sans-serif;
  }
  input[type="text"]::placeholder{ color: #5a6883; }
  input[type="text"]:focus{ outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }

  .btn-add{
    width: 46px; flex-shrink:0;
    background: var(--focus); color:#08211c;
    font-size: 1.3rem; line-height:1;
    border-radius: var(--radius-sm);
  }

  .task-list{
    list-style:none;
    display:flex; flex-direction:column; gap:8px;
    max-height: 260px; overflow-y:auto;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .task-list::-webkit-scrollbar{ width:5px; }
  .task-list::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }

  .task{
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 10px 12px 14px;
    display:flex; align-items:center; gap: 12px;
    transition: border-color .2s ease, opacity .2s ease;
  }
  .task.done{ opacity: .5; border-color: rgba(94,234,212,.25); }
  .task.done label{ text-decoration: line-through; color: var(--text-dim); }

  .task input[type="checkbox"]{
    appearance:none; -webkit-appearance:none;
    width: 20px; height:20px; flex-shrink:0;
    border-radius: 6px;
    border: 1.5px solid var(--line);
    cursor:pointer;
    display:grid; place-content:center;
    transition: all .15s ease;
  }
  .task input[type="checkbox"]:checked{
    background: var(--focus); border-color: var(--focus);
  }
  .task input[type="checkbox"]:checked::after{
    content:'';
    width:5px; height:9px;
    border: solid #08211c;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px,-1px);
  }

  .task label{
    flex:1; font-size: .93rem; color: var(--text);
    cursor:pointer; user-select:none;
    overflow-wrap: anywhere;
  }

  .btn-delete{
    background: transparent; color: var(--text-dim);
    width: 30px; height:30px; flex-shrink:0;
    border-radius: 8px;
    font-size: 1rem;
  }
  .btn-delete:hover{ background: rgba(248,113,113,.12); color: var(--danger); }

  .empty-state{
    text-align:center;
    padding: 26px 10px;
    color: var(--text-dim);
    font-size: .88rem;
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
  }

  .agenda-foot{
    display:flex; justify-content:flex-end;
  }
  .btn-clear{
    background:transparent; color: var(--text-dim);
    font-size: .8rem; padding: 6px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn-clear:hover{ color: var(--danger); }

  @media (max-width: 380px){
    .card{ padding: 24px 16px 20px; gap: 22px; }
    .ring-wrap{ width: 210px; height:210px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="eyebrow">
    <h2>Focus Tracker</h2>
    <span id="clock">--:--</span>
  </div>

  <div class="card">

    <!-- POMODORO -->
    <section class="pomodoro">
      <div class="ring-wrap">
        <svg viewBox="0 0 240 240">
          <circle class="ring-track" cx="120" cy="120" r="108"></circle>
          <circle class="ring-progress" id="ring" cx="120" cy="120" r="108"></circle>
        </svg>
        <div class="ring-center">
          <div class="status-badge" id="statusBadge">Foco</div>
          <div class="time" id="timer">25:00</div>
          <div class="cycle-dots" id="cycleDots"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="btnStart">Iniciar</button>
        <button class="btn-ghost" id="btnReset">Resetar</button>
        <button class="btn-ghost" id="btnSkip">Pular</button>
      </div>

      <div class="duration-row">
        <div class="stepper" data-mode="focus">
          <button data-action="dec">−</button>
          <span class="val" id="focusVal">Foco 25m</span>
          <button data-action="inc">+</button>
        </div>
        <div class="stepper" data-mode="rest">
          <button data-action="dec">−</button>
          <span class="val" id="restVal">Pausa 5m</span>
          <button data-action="inc">+</button>
        </div>
      </div>
    </section>

    <hr>

    <!-- AGENDA -->
    <section class="agenda">
      <div class="agenda-head">
        <h3>Agenda de hoje</h3>
        <span class="count" id="taskCount">0/0</span>
      </div>

      <div class="input-group">
        <input type="text" id="taskInput" placeholder="O que vamos fazer hoje?" maxlength="140">
        <button class="btn-add" id="btnAdd">+</button>
      </div>

      <ul class="task-list" id="taskList"></ul>
      <p class="empty-state" id="emptyState">Nenhuma tarefa ainda. Adicione a primeira acima.</p>

      <div class="agenda-foot">
        <button class="btn-clear" id="btnClearDone">Limpar concluídas</button>
      </div>
    </section>

  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     STORAGE — usa window.storage quando disponível (persistente),
     com fallback em memória para não quebrar se indisponível.
  ============================================================ */
  const Store = {
    async get(key, fallback) {
      try {
        const res = await window.storage?.get(key, false);
        return res ? JSON.parse(res.value) : fallback;
      } catch {
        return fallback;
      }
    },
    async set(key, value) {
      try { await window.storage?.set(key, JSON.stringify(value), false); }
      catch { /* mantém apenas em memória nesta sessão */ }
    }
  };

  /* ============================================================
     RELÓGIO DO TOPO
  ============================================================ */
  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  tickClock();
  setInterval(tickClock, 1000 * 15);

  /* ============================================================
     POMODORO
  ============================================================ */
  const Timer = (() => {
    const RING_RADIUS = 108;
    const RING_CIRC = 2 * Math.PI * RING_RADIUS;

    const el = {
      time: document.getElementById('timer'),
      badge: document.getElementById('statusBadge'),
      ring: document.getElementById('ring'),
      dots: document.getElementById('cycleDots'),
      btnStart: document.getElementById('btnStart'),
      btnReset: document.getElementById('btnReset'),
      btnSkip: document.getElementById('btnSkip'),
      focusVal: document.getElementById('focusVal'),
      restVal: document.getElementById('restVal'),
    };

    let durations = { focus: 25, rest: 5 };   // minutos
    let secondsLeft = durations.focus * 60;
    let mode = 'focus';                        // 'focus' | 'rest'
    let running = false;
    let intervalId = null;
    let cyclesDone = 0;
    const CYCLES_TARGET = 4;

    el.ring.style.strokeDasharray = `${RING_CIRC}`;

    function totalSeconds() { return durations[mode] * 60; }

    function format(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${m}:${ss}`;
    }

    function paintMode() {
      const isRest = mode === 'rest';
      el.badge.textContent = isRest ? 'Pausa' : 'Foco';
      el.badge.classList.toggle('rest', isRest);
      el.ring.classList.toggle('rest', isRest);
      el.btnStart.classList.toggle('rest', isRest);
      document.title = `${format(secondsLeft)} · ${isRest ? 'Pausa' : 'Foco'} — Focus Tracker`;
    }

    function paintDots() {
      el.dots.innerHTML = Array.from({ length: CYCLES_TARGET }, (_, i) =>
        `<span class="${i < cyclesDone % CYCLES_TARGET || (cyclesDone > 0 && cyclesDone % CYCLES_TARGET === 0 && i < CYCLES_TARGET) ? 'done' : ''}"></span>`
      ).join('');
    }

    function paintRing() {
      const progress = 1 - secondsLeft / totalSeconds();
      const offset = RING_CIRC * (1 - progress);
      el.ring.style.strokeDashoffset = offset;
    }

    function paintTime() {
      el.time.textContent = format(secondsLeft);
      document.title = `${format(secondsLeft)} · ${mode === 'rest' ? 'Pausa' : 'Foco'} — Focus Tracker`;
    }

    function paintDurations() {
      el.focusVal.textContent = `Foco ${durations.focus}m`;
      el.restVal.textContent = `Pausa ${durations.rest}m`;
    }

    function render() {
      paintMode();
      paintTime();
      paintRing();
      paintDots();
      paintDurations();
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = mode === 'focus' ? 880 : 660; // toca ANTES de trocar de modo
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.55);
      } catch { /* áudio indisponível — ignora silenciosamente */ }
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    }

    function completeCycle() {
      clearInterval(intervalId);
      running = false;
      beep();
      if (mode === 'focus') cyclesDone++;
      switchMode(true);
      el.btnStart.textContent = 'Iniciar';
    }

    function tick() {
      secondsLeft--;
      if (secondsLeft <= 0) { completeCycle(); return; }
      paintTime();
      paintRing();
    }

    function toggle() {
      if (running) {
        clearInterval(intervalId);
        running = false;
        el.btnStart.textContent = 'Retomar';
      } else {
        running = true;
        el.btnStart.textContent = 'Pausar';
        intervalId = setInterval(tick, 1000);
      }
    }

    function reset() {
      clearInterval(intervalId);
      running = false;
      secondsLeft = totalSeconds();
      el.btnStart.textContent = 'Iniciar';
      render();
    }

    function switchMode(auto = false) {
      mode = mode === 'focus' ? 'rest' : 'focus';
      secondsLeft = totalSeconds();
      if (!auto) { clearInterval(intervalId); running = false; el.btnStart.textContent = 'Iniciar'; }
      render();
    }

    function changeDuration(which, delta) {
      const min = 1, max = 90;
      durations[which] = Math.min(max, Math.max(min, durations[which] + delta));
      if (mode === which && !running) { secondsLeft = totalSeconds(); }
      render();
      Store.set('focusDurations', durations);
    }

    async function init() {
      const saved = await Store.get('focusDurations', null);
      if (saved && saved.focus && saved.rest) durations = saved;
      secondsLeft = totalSeconds();
      render();

      el.btnStart.addEventListener('click', toggle);
      el.btnReset.addEventListener('click', reset);
      el.btnSkip.addEventListener('click', () => { if (mode === 'focus') cyclesDone++; switchMode(); });

      document.querySelectorAll('.stepper').forEach(stepper => {
        const which = stepper.dataset.mode;
        stepper.querySelector('[data-action="dec"]').addEventListener('click', () => changeDuration(which, -1));
        stepper.querySelector('[data-action="inc"]').addEventListener('click', () => changeDuration(which, +1));
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) { paintTime(); paintRing(); }
      });
    }

    return { init };
  })();

  /* ============================================================
     AGENDA
  ============================================================ */
  const Agenda = (() => {
    const el = {
      input: document.getElementById('taskInput'),
      btnAdd: document.getElementById('btnAdd'),
      list: document.getElementById('taskList'),
      empty: document.getElementById('emptyState'),
      count: document.getElementById('taskCount'),
      btnClear: document.getElementById('btnClearDone'),
    };

    let tasks = [];

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    function render() {
      el.list.innerHTML = '';
      el.empty.style.display = tasks.length ? 'none' : 'block';

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task ${task.done ? 'done' : ''}`;
        li.innerHTML = `
          <input type="checkbox" id="t-${task.id}" ${task.done ? 'checked' : ''} aria-label="Concluir tarefa">
          <label for="t-${task.id}"></label>
          <button class="btn-delete" aria-label="Excluir tarefa">✕</button>
        `;
        li.querySelector('label').textContent = task.text; // evita injeção de HTML
        li.querySelector('input').addEventListener('change', () => toggleTask(task.id));
        li.querySelector('.btn-delete').addEventListener('click', () => removeTask(task.id));
        el.list.appendChild(li);
      });

      const done = tasks.filter(t => t.done).length;
      el.count.textContent = `${done}/${tasks.length}`;
      el.btnClear.style.visibility = done ? 'visible' : 'hidden';
    }

    function persist() { Store.set('focusTasks', tasks); }

    function addTask() {
      const text = el.input.value.trim();
      if (!text) return;
      tasks.unshift({ id: uid(), text, done: false });
      el.input.value = '';
      persist();
      render();
    }

    function toggleTask(id) {
      const t = tasks.find(t => t.id === id);
      if (t) { t.done = !t.done; persist(); render(); }
    }

    function removeTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      persist();
      render();
    }

    function clearDone() {
      tasks = tasks.filter(t => !t.done);
      persist();
      render();
    }

    async function init() {
      tasks = await Store.get('focusTasks', []);
      render();

      el.btnAdd.addEventListener('click', addTask);
      el.input.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
      el.btnClear.addEventListener('click', clearDone);
    }

    return { init };
  })();

  Timer.init();
  Agenda.init();
})();
</script>
</body>
</html>
